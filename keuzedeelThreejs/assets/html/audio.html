
<!DOCTYPE html>
<html lang="en">
    <style>
        body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}
    </style>
<head>
    <link rel="stylesheet" href="../../scripts/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio</title>
</head>
<body>
    <h1>AUDIO</h1>
</body>
<script>
const songs = [
    "../audio/paradiso.mp3",
    "../audio/bgmloop.mp3",
    "../audio/rainydayrainallday.mp3",
    "../audio/forestyploinkie.mp3"
];

songs.forEach(song => {
    const audio = document.createElement("audio");

    audio.src = song;
    audio.controls = true;

    document.body.appendChild(audio);
    document.body.appendChild(document.createElement("br"));
});
</script>

</html>
