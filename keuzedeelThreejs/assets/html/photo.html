
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../../scripts/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio</title>
</head>
<body>
    <h1>IMAGES</h1>
    <div id="grid"></div>
</body>

<script>
const pictures = [
    "../images/aliem.png",
    "../images/flower.jpg",
    "../images/new1.png",
    "../images/gyal.png",
    "../images/new2.png",
    "../images/skull.png",
    "../images/cityboy.png",
    "../images/vnlvl1.png",
    "../images/ultra.png",
];

const grid = document.getElementById("grid");

pictures.forEach(pic => {
    const img = document.createElement("img");
    img.src = pic;
    img.style.width = "100%";
    grid.appendChild(img);
});
</script>

</html>
